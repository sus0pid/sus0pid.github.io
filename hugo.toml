# Global options
baseURL = '/'
languageCode = 'en-us'
title = 'Xinshu Ma'
theme = 'barks'
copyright = "© 2026 by Xinshu Ma. <a href='/privacy'>Privacy policy</a>."
defaultContentLanguage = "en"
disableKinds = ["taxonomy"]




# Customization options
[params]

    [params.head]
        author = "Xinshu Ma"
        custom_css = "/custom.css"
        description = "Xinshu Ma: cryptography, systems and networking"
        keywords = ["network security", "cryptography", "academic", "post-quantum TLS", "datacenter networks", "University of Edinburgh", "Cloudflare"]

    [params.header]
        pronunciation = "pronounced Sin-shoo"
        email = "maxinshusu@gmail.com"

        # Link row under the name. Kept here rather than in [menu], because
        # Hugo lowercases menu URLs and GitHub Pages paths are case-sensitive.
        [[params.header.links]]
            name = "github"
            url  = "https://github.com/sus0pid"
        [[params.header.links]]
            name = "scholar"
            url  = "https://scholar.google.com/citations?user=o3Y8k04AAAAJ&hl=en"
        [[params.header.links]]
            name = "cv"
            url  = "/Xinshu_CV.pdf"

    [params.navigation]
        show_navigation = true

    [params.footer]
        show_footer = true

    [params.typography]
        title_font = "IBM Plex Sans"
       #title_font = "Merriweather"
        body_font = "IBM Plex Sans"

    [params.colors]
        theme_color = "#333333"
        background_color = "#fcfbf9"
        text_color = "#333333"
        link_color = "#17442a"



# Options for Markdown renderer
[markup]

    [markup.goldmark.renderer]
        unsafe = true
        xHTML = true

    [markup.highlight]
        style = 'dracula'
